
name: Docker Fullstack

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    # Only push images on a push event, not on pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./CrudService
          file: ./CrudService/backend.Dockerfile
          push: true
          tags: jasvithavattikuti/bus-management-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./bus-frontend
          file: ./bus-frontend/frontend.Dockerfile
          push: true
          tags: jasvithavattikuti/bus-management-frontend:latest
